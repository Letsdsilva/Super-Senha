<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mega Senha - Mega Show</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<section id="inicioTela" class="tela ativa">
<div class="container">

<h1>🎤 MEGA SENHA</h1>
<h2>MEGA SHOW</h2>

<p class="subtitulo">Cadastre os 6 participantes</p>

<div class="participantes">

<div class="campo">
<label>Participante 1</label>
<input id="nome1" type="text" placeholder="Digite o nome">
</div>

<div class="campo">
<label>Participante 2</label>
<input id="nome2" type="text" placeholder="Digite o nome">
</div>

<div class="campo">
<label>Participante 3</label>
<input id="nome3" type="text" placeholder="Digite o nome">
</div>

<div class="campo">
<label>Participante 4</label>
<input id="nome4" type="text" placeholder="Digite o nome">
</div>

<div class="campo">
<label>Participante 5</label>
<input id="nome5" type="text" placeholder="Digite o nome">
</div>

<div class="campo">
<label>Participante 6</label>
<input id="nome6" type="text" placeholder="Digite o nome">
</div>

</div>

<button id="btnComecar">COMEÇAR JOGO</button>

</div>
</section>


<section id="duplasTela" class="tela">

<div class="container">

<h1>👥 DUPLAS</h1>

<h2>RODADA <span id="numeroRodada">1</span></h2>

<div id="duplasContainer"></div>

<button id="btnComecarRodada">
COMEÇAR RODADA
</button>

</div>

</section>


<section id="jogoTela" class="tela">

<div class="container">

<div class="topo">

<div>
RODADA
<strong id="rodadaTopo">1</strong>
</div>

<div id="cronometro">
01:00
</div>

</div>

<h2 id="jogadorPista"></h2>

<p>faz a pista para:</p>

<h2 id="jogadorAdivinha"></h2>

<div class="palavra-box">

<span>PALAVRA</span>

<strong id="palavra">
---
</strong>

</div>

<div class="placar">

<div>
ACERTOS
<strong id="acertos">0</strong>
</div>

<div>
PULOS
<strong id="pulos">0</strong>
</div>

</div>

<div class="botoes">

<button id="btnAcertou">
✅ ACERTOU
</button>

<button id="btnPular">
⏭️ PULAR
</button>

<button id="btnAnular">
🚫 PALAVRA ANULADA
</button>

</div>

</div>

</section>


<section id="trocaDuplaTela" class="tela">

<div class="container">

<h1>🔄 TROCA DE FUNÇÃO</h1>

<p>
<span id="jogadorSai"></span>
agora passa a vez para
<span id="jogadorEntra"></span>.
</p>

<h2 id="mensagemTroca">
Agora os jogadores devem trocar de função.
</h2>

<button id="btnTrocarTurno">
COMEÇAR SEGUNDO TURNO
</button>

</div>

</section>


<section id="trocaProximaDuplaTela" class="tela">

<div class="container">

<h1>🏆 PRÓXIMA DUPLA</h1>

<p>Dupla anterior:</p>

<h2 id="duplaAnterior"></h2>

<p>Próxima dupla:</p>

<h2 id="proximaDupla"></h2>

<button id="btnProximaDupla">
INICIAR PRÓXIMA DUPLA
</button>

</div>

</section>


<section id="resultadoTela" class="tela">

<div class="container">

<h1 id="tituloResultado">
RESULTADO
</h1>

<div id="resultadoContainer"></div>

<h2 id="mensagemEliminacao"></h2>

<button id="btnContinuar">
PRÓXIMA RODADA
</button>

</div>

</section>


<section id="campeaoTela" class="tela">

<div class="container">

<h1>🏆 CAMPEÃO</h1>

<h2 id="campeaoNome"></h2>

<button id="btnNovoJogo">
NOVO JOGO
</button>

</div>

</section>


<script src="script.js"></script>

</body>
</html>
